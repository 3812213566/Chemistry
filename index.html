<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="九年级上册化学：17 个必考实验的化学方程式、实验现象与高频考点，点开化学式即可查看。">
<title>反应图鉴 · 九上化学实验考点</title>
<style>
  :root{
    --paper:#F4F1E7;
    --paper-2:#FBF8EF;
    --card:#FCFAF3;
    --ink:#211E19;
    --muted:#736B5D;
    --faint:#9C9484;
    --line:#DFD8C6;
    --line-strong:#CFC5AE;
    --accent:#8A6A2F;
    --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    --serif:"Songti SC","STSong","Noto Serif SC",SimSun,serif;
    --chem:"Cambria",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    color:var(--ink);
    font-family:var(--sans);
    background:
      radial-gradient(1100px 520px at 12% -8%, #FFFDF7 0%, rgba(255,253,247,0) 62%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(to right, rgba(33,30,25,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(33,30,25,.05) 1px, transparent 1px);
    background-size:32px 32px;
    opacity:.5;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 20%, transparent 80%);
  }
  .page{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:56px 40px 80px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex-wrap:wrap;
    padding-bottom:26px;border-bottom:1px solid var(--line-strong);
  }
  .kicker{
    font-size:11px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .kicker::before{content:"";width:26px;height:1px;background:var(--line-strong)}
  h1{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(38px,5.4vw,60px);line-height:1.02;letter-spacing:.04em;
    margin:0;
  }
  h1 .sep{color:var(--line-strong);margin:0 .12em;font-weight:400}
  h1 small{font-size:.34em;letter-spacing:.16em;color:var(--muted);font-family:var(--sans);font-weight:400;display:block;margin-top:16px}
  .lede{margin:18px 0 0;max-width:34em;font-size:14px;line-height:1.85;color:var(--muted)}
  .stats{display:flex;gap:34px;padding-bottom:4px}
  .stat{text-align:right}
  .stat b{display:block;font-family:var(--chem);font-size:38px;font-weight:400;line-height:1;letter-spacing:.02em}
  .stat span{display:block;margin-top:7px;font-size:11px;letter-spacing:.2em;color:var(--faint)}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding:14px 0;margin-bottom:26px;
    background:linear-gradient(to bottom, rgba(244,241,231,.94) 62%, rgba(244,241,231,0));
    backdrop-filter:blur(6px);
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    font:inherit;font-size:12.5px;letter-spacing:.04em;color:var(--muted);
    background:transparent;border:1px solid var(--line-strong);border-radius:999px;
    padding:7px 14px 7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:.18s ease;
  }
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--d,#8A6A2F);display:block;opacity:.85}
  .chip:hover{border-color:var(--muted);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#FBF8EF}
  .chip.on i{background:#FBF8EF;opacity:.9}
  .chip .c{font-family:var(--chem);opacity:.55;font-size:11px}
  .tools{display:flex;align-items:center;gap:10px}
  .search{position:relative}
  .search input{
    font:inherit;font-size:13px;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid var(--line-strong);
    padding:8px 4px 8px 22px;width:168px;outline:none;transition:.2s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--ink);width:206px}
  .search::before{
    content:"";position:absolute;left:2px;top:50%;width:11px;height:11px;
    border:1.4px solid var(--faint);border-radius:50%;transform:translateY(-62%);
  }
  .search::after{
    content:"";position:absolute;left:11px;top:calc(50% + 4px);width:6px;height:1.4px;
    background:var(--faint);transform:rotate(45deg);
  }
  .ghost{
    font:inherit;font-size:12.5px;color:var(--muted);background:transparent;
    border:1px solid var(--line-strong);border-radius:999px;padding:7px 15px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .ghost:hover{color:var(--ink);border-color:var(--muted)}
  .ghost.on{background:var(--ink);color:#FBF8EF;border-color:var(--ink)}

  /* ---------- view tabs ---------- */
  .tb-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
  .tabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-strong);border-radius:999px;flex:none}
  .tb-sep{width:1px;height:20px;background:var(--line-strong);flex:none;opacity:.55}
  .tab{
    font:inherit;font-size:12.5px;letter-spacing:.06em;color:var(--muted);background:transparent;
    border:0;border-radius:999px;padding:6px 13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.18s;white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--ink);color:#FBF8EF}
  .tab .c{font-family:var(--chem);font-size:11px;opacity:.55}
  .tab.on .c{opacity:.75}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{
    position:relative;overflow:hidden;text-align:left;
    display:flex;flex-direction:column;min-height:238px;
    padding:20px 22px 18px;
    background:var(--card);border:1px solid var(--line);border-radius:3px;
    font:inherit;color:inherit;cursor:pointer;
    transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s, border-color .22s;
    animation:rise .5s both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--accent);opacity:0;transition:opacity .22s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px);border-color:var(--line-strong);
    box-shadow:0 22px 38px -26px rgba(33,30,25,.55);
  }
  .card:hover::before,.card:focus-visible::before{opacity:1}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .c-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .c-num{font-family:var(--chem);font-size:12px;letter-spacing:.14em;color:var(--faint)}
  .c-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10.5px;letter-spacing:.14em;color:var(--accent);
    border:1px solid;border-color:color-mix(in srgb, var(--accent) 30%, transparent);
    background:color-mix(in srgb, var(--accent) 7%, transparent);
    border-radius:2px;padding:3px 7px;
  }
  .c-tag i{width:4px;height:4px;border-radius:50%;background:currentColor}

  .c-eq{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:22px 0 18px;
  }
  .c-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-top:14px;border-top:1px solid var(--line)}
  .c-name{font-size:15px;font-weight:600;letter-spacing:.02em}
  .c-brief{margin-top:6px;font-size:12px;line-height:1.6;color:var(--muted)}
  .c-go{
    flex:none;font-family:var(--chem);font-size:15px;color:var(--faint);
    transition:transform .22s, color .22s;
  }
  .card:hover .c-go{transform:translate(2px,-2px);color:var(--accent)}

  /* ---------- person card ---------- */
  .card.person{--accent:#211E19}
  .p-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 16px}
  .p-name{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:.08em;line-height:1.1}
  .p-meta{margin-top:10px;font-family:var(--chem);font-size:11.5px;letter-spacing:.08em;color:var(--faint)}
  .p-meta .dot{margin:0 7px;opacity:.55}
  .p-role{margin:0;font-size:12.5px;line-height:1.75;color:var(--muted);padding-right:4px}
  .p-plate{font-family:var(--chem);font-size:15px;letter-spacing:.06em;color:var(--muted);gap:0 8px}

  /* ---------- key-point card ---------- */
  .card.key{--accent:#8C3B4A}
  .k-meta{margin-top:10px;font-family:var(--chem);font-size:11.5px;letter-spacing:.12em;color:var(--faint)}

  /* ---------- flow ---------- */
  .flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 0;
        font-family:var(--chem);font-size:16px;letter-spacing:.02em}
  .fl-t{white-space:nowrap;padding:0 3px}
  .fl-a{position:relative;display:inline-block;padding:0 10px;color:var(--faint);font-size:14px}
  .fl-a i{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-style:normal;
          font-size:9.5px;letter-spacing:.12em;color:var(--faint);white-space:nowrap}
  .flow.lg{font-size:19px}
  .flow.lg .fl-a{font-size:17px;padding:0 16px}
  .flow.lg .fl-a i{font-size:10.5px;top:-15px}

  /* ---------- key/value list ---------- */
  .kv{margin:0}
  .kv-row{display:flex;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.8}
  .kv-row:first-child{padding-top:0}
  .kv-row:last-child{border-bottom:0;padding-bottom:0}
  .kv .kv-row b{flex:none;width:92px;font-weight:600;color:var(--ink);letter-spacing:.06em;background:none}
  .kv-row span{flex:1;min-width:0;color:var(--muted)}
  .p-plate .dot{opacity:.5}
  .p-desc{margin:0;font-size:13.5px;line-height:1.95;color:#3B362D}

  /* ---------- equation ---------- */
  .eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 8px;padding-top:16px;line-height:1.8}
  .eq .t{font-family:var(--chem);font-size:18px;white-space:nowrap;letter-spacing:.01em}
  .eq .plus{font-family:var(--chem);font-size:14px;color:var(--faint);padding:0 1px}
  .eq sub{font-size:.66em;vertical-align:-.24em;line-height:0}
  .eq.sm .t{font-size:14.5px}
  .eq.sm .plus{font-size:12px}
  .rxn{
    position:relative;display:inline-flex;flex-direction:column;justify-content:center;
    gap:3px;width:52px;flex:none;margin:0 3px;transform:translateY(-1px);
  }
  .rxn .bar{display:block;width:100%;height:1.6px;background:currentColor;opacity:.72;border-radius:1px}
  .rxn .cond{
    position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
    white-space:nowrap;font-family:var(--sans);font-size:11px;letter-spacing:.08em;
    color:#6A6254;font-weight:500;
  }
  .rxn .cond sub{font-size:.7em;vertical-align:-.2em;line-height:0}

  /* ---------- empty ---------- */
  .empty{grid-column:1/-1;padding:70px 0;text-align:center;color:var(--faint);font-size:14px;letter-spacing:.04em}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:none}
  .modal.open{display:block}
  .scrim{
    position:absolute;inset:0;background:rgba(28,25,20,.42);
    backdrop-filter:blur(3px);animation:fade .25s both;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    position:relative;z-index:1;
    width:min(760px,calc(100% - 40px));max-height:min(88vh,980px);margin:6vh auto 0;
    background:var(--paper-2);border:1px solid var(--line-strong);border-radius:3px;
    box-shadow:0 40px 80px -30px rgba(20,17,12,.6);
    display:flex;flex-direction:column;overflow:hidden;
    animation:pop .32s cubic-bezier(.16,.84,.3,1) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
  .m-top{
    padding:26px 34px 0;flex:none;
    background:linear-gradient(to bottom, color-mix(in srgb, var(--accent) 6%, transparent), transparent);
  }
  .m-kicker{display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
  .m-kicker .d{width:18px;height:1px;background:currentColor}
  .m-kicker .ty{color:var(--accent);letter-spacing:.14em}
  .m-top h2{
    font-family:var(--serif);font-size:clamp(25px,3.2vw,33px);letter-spacing:.03em;
    margin:12px 0 0;line-height:1.25;
  }
  .m-eq-wrap{padding:20px 34px 0;flex:none}
  .eq-label{
    font-size:10.5px;letter-spacing:.2em;color:var(--faint);
    text-align:center;margin:0 0 2px;
  }
  .m-eq{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:20px 8px;margin-top:10px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 12px;line-height:1.9;
  }
  .m-eq .t{font-family:var(--chem);font-size:24px;white-space:nowrap}
  .m-eq .plus{font-family:var(--chem);font-size:19px;color:var(--faint)}
  .m-eq .rxn{width:64px;margin:0 6px}
  .m-eq .rxn .bar{height:1.6px}
  .m-eq .rxn .cond{font-size:11.5px;bottom:calc(100% + 6px)}
  .m-eq.sm .t{font-size:21px}

  .m-eq-wrap.multi{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin-top:10px;padding:10px 0 8px;
  }
  .m-eq-wrap.multi .eq-row{padding:4px 0 6px}
  .m-eq-wrap.multi .m-eq{border:0;margin-top:0;padding:12px 8px 0}
  .m-eq-wrap.multi .eq-label{
    position:static;transform:none;width:auto;margin:2px 0 0;
    text-align:center;font-size:10px;letter-spacing:.2em;
  }

  .m-body{padding:6px 34px 10px;overflow:auto;flex:1;overscroll-behavior:contain}
  .m-body section{padding:22px 0;border-bottom:1px solid var(--line)}
  .m-body section:last-child{border-bottom:0}
  .m-body h3{
    font-size:11px;letter-spacing:.26em;color:var(--faint);font-weight:600;
    margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .m-body h3::after{content:"";flex:1;height:1px;background:var(--line)}

  .phen{list-style:none;margin:0;padding:0}
  .phen li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.9;color:#3B362D}
  .phen li::before{content:"";position:absolute;left:2px;top:.82em;width:5px;height:5px;background:var(--accent);border-radius:50%;opacity:.55}

  ol.pts{list-style:none;margin:0;padding:0;counter-reset:p}
  ol.pts li{
    counter-increment:p;position:relative;padding-left:36px;
    font-size:13.5px;line-height:1.92;color:#3B362D;margin-bottom:9px;
  }
  ol.pts li:last-child{margin-bottom:0}
  ol.pts li::before{
    content:counter(p,decimal-leading-zero);
    position:absolute;left:0;top:.18em;font-family:var(--chem);font-size:11px;
    color:var(--accent);letter-spacing:.04em;opacity:.85;
  }
  .m-body b{font-weight:600;color:var(--ink);background:linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 22%, transparent) 0)}
  .m-body sub{font-size:.68em;vertical-align:-.24em;line-height:0}

  .tipbox{
    background:color-mix(in srgb, #C98A16 9%, transparent);
    border:1px solid color-mix(in srgb, #C98A16 26%, transparent);
    border-radius:2px;padding:16px 18px;margin:22px 0 6px;
  }
  .tipbox h3{color:#9A6A10;margin-bottom:10px}
  .tipbox h3::after{display:none}
  .tipbox ul{list-style:none;margin:0;padding:0}
  .tipbox li{position:relative;padding-left:16px;font-size:12.8px;line-height:1.85;color:#6B5313}
  .tipbox li::before{content:"×";position:absolute;left:0;top:0;font-size:12px;color:#B07C12}

  .m-foot{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 34px;border-top:1px solid var(--line);background:var(--paper-2);
  }
  .nav-btn{
    font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line-strong);
    border-radius:2px;padding:9px 14px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px;
  }
  .nav-btn:hover{color:var(--ink);border-color:var(--muted)}
  .nav-btn:disabled{opacity:.32;cursor:default}
  .nav-btn .k{font-family:var(--chem);font-size:13px}
  .close-x{
    position:absolute;top:16px;right:16px;z-index:2;
    width:34px;height:34px;border:1px solid transparent;border-radius:50%;
    background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;transition:.18s;
  }
  .close-x:hover{background:rgba(33,30,25,.06);color:var(--ink)}

  /* ---------- study mode ---------- */
  body.study .c-eq .t,
  body.study .c-eq .plus,
  body.study .c-eq .fl-t,
  body.study .c-eq .fl-a i,
  body.study .c-eq .rxn{filter:blur(6px);opacity:.75;transition:filter .25s,opacity .25s}
  body.study .card:hover .c-eq .t,
  body.study .card:hover .c-eq .plus,
  body.study .card:hover .c-eq .fl-t,
  body.study .card:hover .c-eq .fl-a i,
  body.study .card:hover .c-eq .rxn,
  body.study .card:focus-visible .c-eq .t,
  body.study .card:focus-visible .c-eq .plus,
  body.study .card:focus-visible .c-eq .fl-t,
  body.study .card:focus-visible .c-eq .fl-a i,
  body.study .card:focus-visible .c-eq .rxn{filter:none;opacity:1}
  body.study .c-eq{position:relative}
  body.study .c-eq::after{
    content:"默写模式 · 悬停显现";position:absolute;bottom:-4px;left:0;right:0;
    text-align:center;font-size:9.5px;letter-spacing:.2em;color:var(--faint);opacity:.85;
  }
  body.study .card:hover .c-eq::after{opacity:0}

  .foot{
    margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
    font-size:11.5px;letter-spacing:.08em;color:var(--faint);line-height:1.9;
  }

  @media (max-width:720px){
    .page{padding:34px 18px 60px}
    .masthead{gap:24px}
    .stats{gap:24px;width:100%}
    .stat{text-align:left}
    .stat b{font-size:30px}
    .toolbar{position:static;gap:12px;padding-top:6px}
    .search input{width:100%}
    .search{flex:1;min-width:120px}
    .grid{grid-template-columns:1fr;gap:12px}
    .grid.two{grid-template-columns:1fr}
    .card{min-height:0;padding:16px 17px 14px}
    .c-eq{padding:16px 0 14px}
    .eq .t{font-size:17px}
    .eq.sm .t{font-size:14.5px}
    .sheet{width:100%;max-height:100%;height:100%;margin:0;border:0;border-radius:0}
    .m-top{padding:24px 20px 0}
    .m-eq-wrap{padding:16px 20px 0}
    .m-eq .t{font-size:19px}
    .m-eq .rxn{width:52px}
    .m-eq-wrap.multi .eq-label{
      position:static;transform:none;width:auto;text-align:center;margin:2px 0 0;
    }
    .m-eq-wrap.multi .eq-row{padding:5px 0}
    .m-body{padding:4px 20px 8px}
    .m-foot{padding:12px 20px}
    .close-x{top:10px;right:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

/* ---------- 进站彩蛋 ---------- */
html.splash-lock,html.splash-lock body{overflow:hidden}
#splash{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 50% 42%, #332d26 0%, #1B1713 55%, #100D0A 100%);
  cursor:pointer;opacity:1;transition:opacity .55s ease}
#splash.go{opacity:0;pointer-events:none}
.sp-card{display:flex;flex-direction:column;align-items:center;gap:20px;
  animation:spIn .7s cubic-bezier(.2,.8,.3,1) .1s both}
#splash.go .sp-card{animation:spPop .55s ease forwards}
.sp-img{width:min(540px,76vw);max-height:58vh;object-fit:cover;display:block;
  border-radius:3px;box-shadow:0 34px 80px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.07)}
.sp-cap{color:#B7AE9C;font-size:12px;letter-spacing:.3em;text-transform:none}
.sp-btn{margin-top:2px;font:inherit;font-size:13px;letter-spacing:.16em;color:#F4F1E7;
  background:rgba(255,255,255,.05);border:1px solid rgba(244,241,231,.4);
  border-radius:999px;padding:11px 26px;cursor:pointer;transition:.28s}
#splash:hover .sp-btn{background:rgba(244,241,231,.13);border-color:rgba(244,241,231,.72)}
.sp-tip{color:#6F685C;font-size:11.5px;letter-spacing:.12em}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes spPop{0%{opacity:1;transform:scale(1)}
  35%{transform:scale(1.07) rotate(-1.2deg)}
  100%{opacity:0;transform:scale(1.35) rotate(1.5deg)}}
@media (max-width:520px){
  .sp-img{width:min(300px,78vw);max-height:44vh}
  .sp-cap{font-size:11px;letter-spacing:.22em}
}
</style>

    {k:"由离子构成", v:"盐 NaCl、CuSO₄；碱 NaOH；金属氧化物 MgO、CuO——由阳离子和阴离子构成"}
  ],
  points:[
    "判断「构成」先看类别：金属、稀有气体、固态非金属 → 原子；气态非金属单质和共价化合物 → 分子；盐、碱、金属氧化物 → 离子。",
    "描述<b>组成</b>用元素（宏观）：水由氢元素和氧元素组成；描述<b>构成</b>用粒子（微观）：水由水分子构成。",
    "1 个水分子由 2 个氢原子和 1 个氧原子构成——不能说「水由氢原子和氧原子构成」。",
    "化学变化中<b>分子可分、原子不可分</b>，这是分子与原子最本质的区别。",
    "原子得失电子形成离子：Na 失去 1 个电子 → Na⁺，Cl 得到 1 个电子 → Cl⁻，所带电荷数等于得失电子数。",
    "离子符号写在元素符号<b>右上角</b>，数字在前、正负号在后：Mg²⁺、SO₄²⁻。"
  ],
  tips:[
    "说「水由氢气和氧气组成」——组成要用元素",
    "说「NaCl 由 NaCl 分子构成」——由 Na⁺ 和 Cl⁻ 构成",
    "说「分子一定比原子大」——不同物质之间不能比大小"
  ]
},
{
  name:"工业净水全流程",
  meta:"自来水是怎么来的",
  role:"取水 → 加絮凝剂 → 沉淀 → 过滤 → 吸附 → 消毒 → 配水。每一步都要能说出作用，还要能判断是物理变化还是化学变化。",
  flow:[{t:"取水"},{a:"加明矾"},{t:"沉淀"},{a:"过滤"},{t:"吸附"},{a:"消毒"},{t:"配水"}],
  kv:[
    {k:"取水", v:"从河流、湖泊取水，用格栅拦去漂浮物"},
    {k:"加絮凝剂", v:"加明矾，溶于水生成胶状物，吸附悬浮杂质使其沉降"},
    {k:"沉淀", v:"静置，悬浮的小颗粒沉到池底形成污泥"},
    {k:"过滤", v:"通过滤池除去不溶性杂质，水变澄清"},
    {k:"吸附", v:"活性炭吸附色素和异味（物理变化）"},
    {k:"消毒", v:"通氯气、二氧化氯或臭氧，杀灭细菌病毒（化学变化）"},
    {k:"配水", v:"加压送入供水管网"}
  ],
  points:[
    "明矾的作用：溶于水生成胶状物，<b>吸附悬浮杂质</b>使其沉降，只能除去不溶性杂质。",
    "活性炭的作用：疏松多孔，吸附<b>色素和异味</b>，属于<b>物理变化</b>；不能除去可溶性钙镁离子。",
    "硬水与软水：硬水是含<b>较多可溶性钙、镁化合物</b>的水，软水是不含或含较少可溶性钙、镁化合物的水；加肥皂水，泡沫多的是软水。",
    "过滤除去不溶性杂质；消毒（通氯气、二氧化氯、臭氧）是<b>化学变化</b>，杀灭细菌和病毒。",
    "净化程度由低到高：静置沉淀 < 过滤 < 吸附 < 蒸馏；蒸馏是净化程度最高的单一操作。",
    "自来水不宜直接养鱼，是因为残留的余氯；晒水或除氯后再用。"
  ],
  tips:[
    "认为活性炭能除去可溶性钙镁离子、能软化硬水",
    "把消毒说成物理变化（杀菌是化学变化）",
    "认为过滤之后得到的是纯水"
  ]
}
];

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const pad2 = n => String(n).padStart(2,"0");

function subDigits(str){
  return str.replace(/(\d+)/g, "<sub>$1</sub>");
}
function termHtml(t){
  const m = t.match(/^(\d+)\s*(.+)$/);
  if (m && m[2]) return m[1] + subDigits(m[2]);
  return subDigits(t);
}
function splitTerms(s){
  return s.split("+").map(x=>x.trim()).filter(Boolean);
}
function rxnHtml(cond){
  const c = cond ? `<span class="cond">${cond}</span>` : "";
  return `<span class="rxn" aria-label="生成">${c}<span class="bar"></span><span class="bar"></span></span>`;
}
function eqHtml(eq, cls=""){
  const left = splitTerms(eq.l).map(t=>`<span class="t">${termHtml(t)}</span>`).join('<span class="plus">+</span>');
  const right = splitTerms(eq.r).map(t=>`<span class="t">${termHtml(t)}</span>`).join('<span class="plus">+</span>');
  return `<div class="eq ${cls}">${left}${rxnHtml(eq.c)}${right}</div>`;
}
function plainEq(eq){
  return `${eq.l} = ${eq.c ? eq.c.replace(/<[^>]+>/g,"") + " " : ""}${eq.r}`;
}
function flowHtml(flow, cls=""){
  if(!flow) return "";
  return `<div class="flow ${cls}">` + flow.map(s=>
    s.a ? `<span class="fl-a"><i>${s.a}</i>→</span>` : `<span class="fl-t">${s.t}</span>`
  ).join("") + `</div>`;
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g,""); }

/* ---------- index ---------- */
DATA.forEach((d,i)=>{
  d.id = i + 1;
  d.color = TYPE_COLOR[d.type] || TYPE_COLOR["其他"];
  d._idx = stripTags([d.name, d.type, d.brief, d.tags.join(" "), d.phen.join(" "), d.points.join(" "), d.eqs.map(plainEq).join(" ")].join(" "))
            .toLowerCase();
});

PEOPLE.forEach((p,i)=>{
  p.pid = i + 1;
  p.kind = "person";
  p._idx = stripTags([p.name, p.en, p.country, p.role, p.points.join(" "), p.tips.join(" ")].join(" ")).toLowerCase();
});

KEY.forEach((k,i)=>{
  k.kid = i + 1;
  k.kind = "key";
  k._idx = stripTags([k.name, k.meta, k.role, (k.kv||[]).map(r=>r.k+" "+r.v).join(" "), k.points.join(" "), k.tips.join(" ")].join(" ")).toLowerCase();
});

const KNOW = [...PEOPLE, ...KEY];

/* ---------- stats ---------- */
$("#statN").textContent = DATA.length;
$("#statT").textContent = new Set(DATA.map(d=>d.type)).size;
$("#statE").textContent = DATA.reduce((n,d)=>n+d.eqs.length,0);
$("#statP").textContent = PEOPLE.length;
$("#statK").textContent = KEY.length;
$('.tab[data-view="rxn"] .c').textContent = DATA.length;
$('.tab[data-view="know"] .c').textContent = PEOPLE.length;
$('.tab[data-view="key"] .c').textContent = KEY.length;

/* ---------- filters ---------- */
const FILTERS = ["全部","化合反应","分解反应","置换反应","复分解反应","基本操作","其他"];
let activeFilter = "全部";
let keyword = "";

function renderFilters(){
  const box = $("#filters");
  box.innerHTML = FILTERS.map(f=>{
    const n = f === "全部" ? DATA.length : DATA.filter(d=>d.type===f).length;
    const c = f === "全部" ? "#211E19" : TYPE_COLOR[f];
    return `<button class="chip ${f===activeFilter?"on":""}" data-f="${f}" style="--d:${c}">
      <i></i>${f==="全部"?"全部":TYPE_SHORT[f]}<span class="c">${n}</span>
    </button>`;
  }).join("");
  box.querySelectorAll(".chip").forEach(b=>{
    b.addEventListener("click", ()=>{
      activeFilter = b.dataset.f;
      renderFilters(); renderGrid();
    });
  });
}

/* ---------- grid ---------- */
function visible(){
  if(view === "know"){
    return PEOPLE.filter(p=> !keyword || p._idx.includes(keyword));
  }
  if(view === "key"){
    return KEY.filter(k=> !keyword || k._idx.includes(keyword));
  }
  return DATA.filter(d=>{
    const okType = activeFilter === "全部" || d.type === activeFilter;
    const okKey = !keyword || d._idx.includes(keyword);
    return okType && okKey;
  });
}

function personCard(p, i){
  return `<button class="card person" data-pid="${p.pid}" style="animation-delay:${Math.min(i*26,320)}ms">
    <div class="c-head">
      <span class="c-num">No.P${pad2(p.pid)}</span>
      <span class="c-tag"><i></i>${p.country}</span>
    </div>
    <div class="p-body">
      <div class="p-name">${p.name}</div>
      <div class="p-meta">${p.en}<span class="dot">·</span>${p.life}</div>
    </div>
    <div class="c-foot">
      <p class="p-role">${p.role}</p>
      <span class="c-go">↗</span>
    </div>
  </button>`;
}

function keyCard(k, i){
  return `<button class="card key" data-kid="${k.kid}" style="animation-delay:${Math.min(i*26,320)}ms">
    <div class="c-head">
      <span class="c-num">No.K${pad2(k.kid)}</span>
      <span class="c-tag"><i></i>重要考点</span>
    </div>
    <div class="p-body">
      <div class="p-name">${k.name}</div>
      <div class="k-meta">${k.meta}</div>
    </div>
    <div class="c-foot">
      <p class="p-role">${k.role}</p>
      <span class="c-go">↗</span>
    </div>
  </button>`;
}

function renderGrid(){
  const list = visible();
  const grid = $("#grid");
  grid.classList.toggle("two", view === "key");
  if(!list.length){
    grid.innerHTML = `<div class="empty">没有找到相关${view==="know"?"内容":"实验"}，换个关键词试试</div>`;
    return;
  }
  if(view === "know"){
    grid.innerHTML = list.map((x,i)=> personCard(x,i)).join("");
    grid.querySelectorAll(".card").forEach(c=>{
      c.addEventListener("click", ()=> openModal("person", Number(c.dataset.pid)));
    });
    return;
  }
  if(view === "key"){
    grid.innerHTML = list.map((x,i)=> keyCard(x,i)).join("");
    grid.querySelectorAll(".card").forEach(c=>{
      c.addEventListener("click", ()=> openModal("key", Number(c.dataset.kid)));
    });
    return;
  }
  grid.innerHTML = list.map((d,i)=>{
    const hasEq = d.eqs.length > 0;
    const long = hasEq && plainEq(d.eqs[0]).length > 26;
    const middle = hasEq
      ? `<div class="c-eq">${eqHtml(d.eqs[0], long?"sm":"")}</div>`
      : `<div class="c-eq">${flowHtml(d.flow)}</div>`;
    return `<button class="card" data-id="${d.id}" style="--accent:${d.color};animation-delay:${Math.min(i*26,320)}ms">
      <div class="c-head">
        <span class="c-num">No.${pad2(d.id)}</span>
        <span class="c-tag"><i></i>${TYPE_SHORT[d.type]}</span>
      </div>
      ${middle}
      <div class="c-foot">
        <div>
          <div class="c-name">${d.name}</div>
          <div class="c-brief">${d.brief}</div>
        </div>
        <span class="c-go">↗</span>
      </div>
    </button>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=> openModal("rxn", Number(c.dataset.id)));
  });
}

/* ---------- view ---------- */
let view = "rxn";
function setView(v){
  view = v;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.view===v));
  $("#q").value = "";
  keyword = "";
  const isData = v === "rxn";
  $("#filters").style.display = isData ? "" : "none";
  $("#tbSep").style.display   = isData ? "" : "none";
  $("#q").placeholder = v === "know" ? "搜索人物 / 国名 / 考点"
                     : v === "key"  ? "搜索考点 / 关键词"
                     : "搜索实验 / 物质 / 考点";
  $("#study").style.display = isData ? "" : "none";
  document.body.classList.remove("study");
  const st = $("#study");
  st.classList.remove("on");
  st.textContent = "默写模式";
  renderFilters();
  renderGrid();
}
document.querySelectorAll(".tab").forEach(b=>{
  b.addEventListener("click", ()=> setView(b.dataset.view));
});

/* ---------- modal ---------- */
let cur = {kind:"rxn", n:1};

function setHash(h){
  try{ history.replaceState(null, "", h); }catch(e){ /* file:// 下部分浏览器会拒绝 */ }
}

function openModal(kind, n){
  const list = kind === "person" ? PEOPLE : kind === "key" ? KEY : DATA;
  const d = list[n-1];
  if(!d) return;
  cur = {kind, n};
  const m = $("#modal");
  const accent = kind === "person" ? "#211E19" : kind === "key" ? "#8C3B4A" : d.color;
  m.style.setProperty("--accent", accent);

  if(kind === "person"){
    $("#mKicker").textContent = `人物 ${pad2(n)}`;
    $("#mType").textContent = d.country;
    $("#mTitle").textContent = d.name;
    $("#mEqs").classList.remove("multi");
    $("#mEqs").innerHTML = `<div class="m-eq p-plate"><span>${d.en}</span><span class="dot">·</span><span>${d.life}</span></div>`;
    $("#mBody").innerHTML = `
      <section>
        <h3>他是谁</h3>
        <p class="p-desc">${d.role}</p>
      </section>
      <section>
        <h3>高频考点</h3>
        <ol class="pts">${d.points.map(p=>`<li>${p}</li>`).join("")}</ol>
      </section>
      <div class="tipbox">
        <h3>易错提醒</h3>
        <ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>`;
  } else if(kind === "key"){
    $("#mKicker").textContent = `考点 K${pad2(n)}`;
    $("#mType").textContent = "重要考点";
    $("#mTitle").textContent = d.name;
    $("#mEqs").classList.remove("multi");
    $("#mEqs").innerHTML = d.flow
      ? flowHtml(d.flow, "lg")
      : `<div class="m-eq p-plate"><span>${d.meta}</span></div>`;
    $("#mBody").innerHTML = `
      <section>
        <h3>核心内容</h3>
        ${d.kv
          ? `<div class="kv">${d.kv.map(r=>`<div class="kv-row"><b>${r.k}</b><span>${r.v}</span></div>`).join("")}</div>`
          : `<p class="p-desc">${d.role}</p>`}
      </section>
      <section>
        <h3>高频考点</h3>
        <ol class="pts">${d.points.map(p=>`<li>${p}</li>`).join("")}</ol>
      </section>
      <div class="tipbox">
        <h3>易错提醒</h3>
        <ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>`;
  } else {
    $("#mKicker").textContent = `实验 ${pad2(n)}`;
    $("#mType").textContent = TYPE_SHORT[d.type] + (d.type === "基本操作" ? "" : "反应");
    $("#mTitle").textContent = d.name;

    if(d.eqs.length){
      $("#mEqs").classList.toggle("multi", d.eqs.length > 1);
      $("#mEqs").innerHTML = d.eqs.map(e=>{
        const long = plainEq(e).length > 30;
        const label = d.eqs.length > 1 && e.label ? `<div class="eq-label">${e.label}</div>` : "";
        const eq = eqHtml(e, "m-eq " + (long ? "sm" : ""));
        return d.eqs.length > 1 ? `<div class="eq-row">${eq}${label}</div>` : label + eq;
      }).join("");
    } else {
      $("#mEqs").classList.remove("multi");
      $("#mEqs").innerHTML = flowHtml(d.flow, "lg");
    }

    $("#mBody").innerHTML = `
      <section>
        <h3>${d.eqs.length ? "实验现象" : "操作要点"}</h3>
        <ul class="phen">${d.phen.map(p=>`<li>${p}</li>`).join("")}</ul>
      </section>
      <section>
        <h3>高频考点</h3>
        <ol class="pts">${d.points.map(p=>`<li>${p}</li>`).join("")}</ol>
      </section>
      <div class="tipbox">
        <h3>易错提醒</h3>
        <ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
      </div>`;
  }

  const prev = list[n-2], next = list[n];
  $("#prevBtn").disabled = !prev;
  $("#nextBtn").disabled = !next;
  $("#prevName").textContent = prev ? prev.name : "已经是第一个";
  $("#nextName").textContent = next ? next.name : "已经是最后一个";

  m.classList.add("open");
  m.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  $(".m-body").scrollTop = 0;
  const h = kind === "person" ? "#P" + pad2(n) : kind === "key" ? "#K" + pad2(n) : "#" + pad2(n);
  setHash(h);
}

function closeModal(){
  $("#modal").classList.remove("open");
  $("#modal").setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  setHash(location.pathname + location.search);
}

function step(delta){
  const list = cur.kind === "person" ? PEOPLE : cur.kind === "key" ? KEY : DATA;
  const target = list[cur.n-1+delta];
  if(target) openModal(cur.kind, cur.n+delta);
}

$("#modal").addEventListener("click", e=>{
  if(e.target.closest("[data-close]")) closeModal();
});
$("#prevBtn").addEventListener("click", ()=>step(-1));
$("#nextBtn").addEventListener("click", ()=>step(1));
document.addEventListener("keydown", e=>{
  if(!$("#modal").classList.contains("open")) return;
  if(e.key === "Escape") closeModal();
  if(e.key === "ArrowLeft") step(-1);
  if(e.key === "ArrowRight") step(1);
});

/* ---------- search & study ---------- */
$("#q").addEventListener("input", e=>{
  keyword = e.target.value.trim().toLowerCase();
  renderGrid();
});
$("#study").addEventListener("click", e=>{
  document.body.classList.toggle("study");
  e.currentTarget.classList.toggle("on");
  e.currentTarget.textContent = document.body.classList.contains("study") ? "默写模式 · 开" : "默写模式";
});

/* ---------- boot ---------- */
renderFilters();
renderGrid();
(function(){
  const h = (location.hash || "").replace("#","");
  if(h === "people" || h === "know"){ setView("know"); return; }
  if(h === "key"){ setView("key"); return; }
  if(/^P\d+$/.test(h)){
    const n = Number(h.slice(1));
    if(PEOPLE[n-1]){ setView("know"); openModal("person", n); }
  } else if(/^K\d+$/.test(h)){
    const n = Number(h.slice(1));
    if(KEY[n-1]){ setView("key"); openModal("key", n); }
  } else if(/^\d+$/.test(h)){
    const n = Number(h);
    if(DATA[n-1]) openModal("rxn", n);
  }
})();
</script>
<script>
(function(){
  var splash = document.getElementById("splash");
  if(!splash) return;
  document.documentElement.classList.add("splash-lock");
  var entered = false;
  function enter(){
    if(entered) return;
    entered = true;
    splash.classList.add("go");
    document.documentElement.classList.remove("splash-lock");
    document.body.style.overflow = "";
    setTimeout(function(){ if(splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
  }
  splash.addEventListener("click", enter);
  document.addEventListener("keydown", function(e){
    if(!entered && (e.key === "Enter" || e.key === " " || e.key === "Escape")){ e.preventDefault(); enter(); }
  }, true);
})();
</script>

</body>
</html>
